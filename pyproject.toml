[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "probabilistic_model_synthesis"
version = "0.1.0"
description = "Code for performing probabilistic model synthesis."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "William Bishop", email = "willbishop.neuro@gmail.com" },
]
dependencies = [
    "h5py",
    "matplotlib",
    "numpy",
    "pandas",
    "POT",
    "scikit-learn",
    "scipy",
    "statsmodels",
    "torch",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["probabilistic_model_synthesis*"]

[tool.setuptools.package-data]
probabilistic_model_synthesis = ["*.mplstyle"]
